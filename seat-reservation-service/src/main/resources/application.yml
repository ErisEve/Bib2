server:
    port: 8084
    # On SIGTERM, stop accepting connections and let in-flight requests finish
    # (up to spring.lifecycle.timeout-per-shutdown-phase) before the context closes.
    shutdown: graceful

spring:
    # Must fit in terminationGracePeriodSeconds (45 s) after the 10 s preStop sleep.
    lifecycle:
        timeout-per-shutdown-phase: 20s
    application:
        name: seat-management-service
    datasource:
        url: "${DB_URL:jdbc:postgresql://localhost:5432/library_metadata}"
        username: "${DB_USERNAME:postgres}"
        password: "${DB_PASSWORD:1}"
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
            show-sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
    # Override with the JWT_SECRET environment variable. Every service must share
    # the same value, or tokens issued by user-service will not validate elsewhere.
    secret: "${JWT_SECRET:dev-only-insecure-secret-change-me-in-production}"
    expiration-ms: ${JWT_EXPIRATION_MS:36000000}

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,gateway  # Add gateway if it's a gateway service
            base-path: /actuator  # Default path
    endpoint:
        health:
            probes:
                enabled: true
            # Readiness includes the database: a pod that cannot reach PostgreSQL
            # is taken out of the Service instead of answering with errors.
            # Liveness stays local - an unreachable database must not restart pods.
            group:
                readiness:
                    include: readinessState,db
                liveness:
                    include: livenessState
            show-details: always
            show-components: always
        info:
            enabled: true
        metrics:
            enabled: true
    info:
        env:
            enabled: true
        build:
            enabled: true

info:
    app:
        name: ${spring.application.name}
        version: 1.0.0
        description: ${spring.application.name} Service
        java:
            version: ${java.version}