apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: biblioteka

resources:
  - namespace.yaml
  - postgres.yaml
  - gateway-service.yaml
  - user-service.yaml
  - library-management-service.yaml
  - loan-management-service.yaml
  - seat-management-service.yaml
  - ui-service.yaml
  - ingress.yaml

configMapGenerator:
  - name: biblioteka-config
    envs:
      - config.env
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: biblioteka-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

# The manifests name the images biblioteka/<name>:dev (the docker-compose tags);
# this retargets them to the GHCR images published by
# .github/workflows/ci.yml. `main` follows the main branch - the containers
# use imagePullPolicy: Always, so `kubectl rollout restart` picks up a new
# build. To pin a release, set newTag to a version (1.2.3) or sha-<short>.
# CI deploys go through k8s/deploy.sh, which rewrites every newTag to the
# commit's sha-<short> (so it can roll back) - keep all six on one tag.
images:
  - name: biblioteka/gateway-service
    newName: ghcr.io/eriseve/biblioteka/gateway-service
    newTag: main
  - name: biblioteka/user-service
    newName: ghcr.io/eriseve/biblioteka/user-service
    newTag: main
  - name: biblioteka/library-service
    newName: ghcr.io/eriseve/biblioteka/library-service
    newTag: main
  - name: biblioteka/loan-service
    newName: ghcr.io/eriseve/biblioteka/loan-service
    newTag: main
  - name: biblioteka/seat-service
    newName: ghcr.io/eriseve/biblioteka/seat-service
    newTag: main
  - name: biblioteka/ui-service
    newName: ghcr.io/eriseve/biblioteka/ui-service
    newTag: main

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: biblioteka

# Placement on k3s: every workload already carries
#   nodeSelector: node-role.kubernetes.io/worker: "worker"
# and the server node is tainted (see k8s/k3s/server-config.yaml), so pods only
# ever land on the two agents.
#
# Never pin a pod to a node with kubernetes.io/hostname. k3s hostnames are the
# lowercased machine name (desktop-xxxxxxx, not DESKTOP-XXXXXXX); a mismatch
# gets the pod rejected by the kubelet with "Predicate NodeAffinity failed",
# and the ReplicaSet immediately replaces it - forever, with no backoff. That
# is what produced ~11k dead pods.
#
# Two spread constraints, added to every workload:
# 1. the whole stack evenly across the agents, instead of stacking it on
#    whichever one the scheduler scores first;
# 2. each service's own replicas across the agents: matchLabelKeys narrows the
#    selector to pods with the same `app` value, so the two replicas of a
#    service don't end up on one node (where a single drain takes both).
# Both are ScheduleAnyway: with DoNotSchedule, pods evicted by a drain would
# stay Pending instead of moving to the remaining agent. nodeTaintsPolicy keeps
# the tainted server out of the count.
patches:
  - patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            nodeTaintsPolicy: Honor
            # Every workload pod in the namespace carries an `app` label.
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            nodeTaintsPolicy: Honor
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists
            matchLabelKeys:
              - app
    target:
      group: apps
      kind: (Deployment|StatefulSet)
