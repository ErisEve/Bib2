# Spring Cloud Gateway. The only service the Ingress points at: its catch-all
# route (Path=/**  ->  http://ui-service:8017) means the same hostname serves both the
# API and the UI, so one Ingress rule covers everything.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      # preStop sleep (10 s) + Spring's graceful shutdown (at most 20 s) + margin.
      terminationGracePeriodSeconds: 45
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      containers:
        - name: gateway-service
          image: biblioteka/gateway-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: biblioteka-config
            - secretRef:
                name: biblioteka-secrets
          lifecycle:
            # Keep serving for a while after the pod is marked terminating: it
            # takes a few seconds until kube-proxy and Traefik stop sending it
            # new connections. Spring's graceful shutdown starts after this.
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 640Mi
              cpu: 1000m
