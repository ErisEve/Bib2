# Moves k3s's bundled Traefik from port 80 to 8080.
#
# ServiceLB publishes Traefik's LoadBalancer ports on every node, so after this
# change http://<any-node-ip>:8080 reaches the gateway. Each origin the browser
# uses must match CORS_ALLOWED_ORIGINS in k8s/config.env ("*" by default).
#
# Apply once:  kubectl apply -f k8s/k3s/traefik-config.yaml
# (or copy it into /var/lib/rancher/k3s/server/manifests/ on the server)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        exposedPort: 8080
