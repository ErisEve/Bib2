# k3s agent (worker) config. On each agent, install as
#   /etc/rancher/k3s/config.yaml
# fill in the placeholders, then: sudo systemctl restart k3s-agent
#
# The token is on the server in /var/lib/rancher/k3s/server/node-token.
# Do not commit it.
server: https://<SERVER_LAN_IP>:6443
token: <NODE_TOKEN>

# The LAN IP the server and the other agent use to reach this node. Flannel
# (UDP 8472) and kubelet traffic (TCP 10250) must be allowed in on it, or
# cross-node service calls and kubectl logs/exec break. On a native Linux agent
# this is just the machine's own address (e.g. 10.100.50.12):
node-ip: <THIS_AGENT_LAN_IP>

# Only if the agent runs inside WSL2: with WSL's default NAT networking, the
# node registers a 172.x address that only its own Windows host can reach. The
# agent still reaches the server and reports Ready, but nothing else can reach
# it. Fix: in %UserProfile%\.wslconfig on the Windows side, set
#   [wsl2]
#   networkingMode=mirrored
# run `wsl --shutdown`, and allow inbound UDP 8472 and TCP 10250 through the
# Windows firewall. The agent then shares the Windows machine's LAN IP; use
# that IP for node-ip above.

# Keep the node name stable and lowercase. Pods are never pinned to it by
# name (see k8s/kustomization.yaml), but a stable name means the Node object and
# its labels survive a reinstall or hostname change.
# node-name: kube02
