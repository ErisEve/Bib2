# Books. Also reads loan-management-service's lending table directly to derive book availability.
apiVersion: v1
kind: Service
metadata:
  name: library-management-service
  labels:
    app: library-management-service
spec:
  selector:
    app: library-management-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management-service
  labels:
    app: library-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-management-service
  template:
    metadata:
      labels:
        app: library-management-service
    spec:
      # preStop sleep (10 s) + Spring's graceful shutdown (at most 20 s) + margin.
      terminationGracePeriodSeconds: 45
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."
                sleep 3
              done
          envFrom:
            - configMapRef:
                name: biblioteka-config
        - name: wait-for-gateway
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://gateway-service:8080/actuator/health/readiness | grep -q UP; do
                echo "waiting for gateway-service..."
                sleep 3
              done
      containers:
        - name: library-management-service
          image: biblioteka/library-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: biblioteka-config
            - secretRef:
                name: biblioteka-secrets
          env:
            # The app reads DB_PASSWORD; the Secret stores it once under the key
            # postgres itself uses, so there is no duplicated value to keep in sync.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteka-secrets
                  key: POSTGRES_PASSWORD
          lifecycle:
            # Keep serving for a while after the pod is marked terminating: it
            # takes a few seconds until kube-proxy and Traefik stop sending it
            # new connections. Spring's graceful shutdown starts after this.
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 640Mi
              cpu: 1000m
