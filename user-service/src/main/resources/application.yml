server:
    port: 8082

spring:
    application:
        name: user-service
    datasource:
        url: "${DB_URL:jdbc:postgresql://localhost:5432/library_metadata}"
        username: "${DB_USERNAME:postgres}"
        password: "${DB_PASSWORD:1}"
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
    # Override with the JWT_SECRET environment variable. Every service must share
    # the same value, or tokens issued by user-service will not validate elsewhere.
    secret: "${JWT_SECRET:dev-only-insecure-secret-change-me-in-production}"
    expiration-ms: ${JWT_EXPIRATION_MS:36000000}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

logging:
    level:
        com.netflix.eureka: DEBUG
        com.netflix.discovery: DEBUG

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,gateway  # Add gateway if it's a gateway service
            base-path: /actuator  # Default path
    endpoint:
        health:
            probes:
                enabled: true
            show-details: always
            show-components: always
        info:
            enabled: true
        metrics:
            enabled: true
    info:
        env:
            enabled: true
        build:
            enabled: true

info:
    app:
        name: ${spring.application.name}
        version: 1.0.0
        description: ${spring.application.name} Service
        java:
            version: ${java.version}