server:
  port: 8080  # Gateway will run on port 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      # The gateway (CorsConfig) and each downstream service both add CORS
      # headers. Browsers reject a doubled Access-Control-Allow-Origin, so keep
      # only the first of each.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Each route points at a plain URL. On Kubernetes (k8s/config.env) and in Compose these are
      # the Service names, which load-balance across pods themselves; the defaults are for local runs.
      routes:
        # ============================================
        # USER SERVICE ROUTES
        # ============================================
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**, /api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/users
            - StripPrefix=0

        # ============================================
        # LIBRARY SERVICE (BOOKS) ROUTES
        # ============================================
        - id: library-management-service
          uri: ${LIBRARY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/books/**
          filters:
            - name: CircuitBreaker
              args:
                name: libraryService
                fallbackUri: forward:/fallback/books
            - StripPrefix=0

        # ============================================
        # LOAN SERVICE ROUTES
        # ============================================
        - id: loan-management-service
          uri: ${LOAN_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/lendings/**
          filters:
            - name: CircuitBreaker
              args:
                name: loanService
                fallbackUri: forward:/fallback/lendings
            - StripPrefix=0

        # ============================================
        # SEAT SERVICE ROUTES
        # ============================================
        - id: seat-management-service
          uri: ${SEAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/seats/**
          filters:
            - name: CircuitBreaker
              args:
                name: seatService
                fallbackUri: forward:/fallback/seats
            - StripPrefix=0

        # ============================================
        # UI SERVICE ROUTES
        # ============================================
        - id: ui-service
          uri: ${UI_SERVICE_URL:http://localhost:8017}
          predicates:
            - Path=/**
          filters:
            - StripPrefix=0

resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
      libraryService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
      loanService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
      seatService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5

  # The CircuitBreaker filter also applies a TimeLimiter, whose default is 1s. That is shorter than
  # a normal call to Open Library from POST /api/books/fetch, so the gateway used to abandon the
  # request and forward it to the fallback while the book was still being saved downstream.
  timelimiter:
    instances:
      userService:
        timeoutDuration: 30s
      libraryService:
        timeoutDuration: 30s
      loanService:
        timeoutDuration: 30s
      seatService:
        timeoutDuration: 30s


# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      probes:
        enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG